<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Contact | Adan Derolus</title>
  <meta name="description" content="Contact Adan Derolus for IT infrastructure, systems administration, technical support, endpoint management, and related opportunities.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header>
    <div class="nav-inner">
      <a href="index.html" class="brand">ADAN DEROLUS</a>
      <nav class="nav-links" aria-label="Primary navigation">
        <a href="index.html">Home</a>
        <a href="experience.html">Experience</a>
        <a href="skills.html">Skills</a>
        <a href="interests.html">Interests</a>
        <a href="resume.html">Résumé</a>
        <a href="contact.html" class="active" aria-current="page">Contact</a>
      </nav>
    </div>
  </header>

  <main>
    <section class="contact-section">
      <div class="page-heading">
        <h1>Let’s connect.</h1>
        
      </div>

      <div class="contact-card">
        <aside class="info-panel">
          <div class="info-content">
            <h2>Email or LinkedIn</h2>
            <p>Have an opportunity or question? Get in touch.</p>

          </div>

          <div class="social-links">
            <a href="https://www.linkedin.com/in/adan-derolus-3b166a1bb/" target="_blank" rel="noopener noreferrer" aria-label="LinkedIn"><i class="fa fa-linkedin"></i></a>
            <a href="mailto:adanderolus@gmail.com" aria-label="Email"><i class="fa fa-envelope"></i></a>
          </div>
        </aside>

        <div class="form-panel">
          <h3>Send a message</h3>

          <form action="https://formspree.io/f/mpwdypjp" method="POST">
            <div class="form-group">
              <label for="name">Your Name</label>
              <input type="text" id="name" name="name" placeholder="John Doe" autocomplete="name" required>
            </div>

            <div class="form-group">
              <label for="email">Your Email</label>
              <input type="email" id="email" name="email" placeholder="john@example.com" autocomplete="email" required>
            </div>

            <div class="form-group">
              <label for="subject">Subject</label>
              <input type="text" id="subject" name="subject" placeholder="Job opportunity, project, question..." required>
            </div>

            <div class="form-group">
              <label for="message">Message</label>
              <textarea id="message" name="message" placeholder="Write your message here..." required></textarea>
            </div>

            <button type="submit" class="submit-button">
              <span>Send Message</span>
              <i class="fa fa-paper-plane" aria-hidden="true"></i>
            </button>
          </form>
        </div>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="footer-content">
      <p class="copyright">&copy; 2026 Adan Derolus. All rights reserved.</p>
      <div class="footer-links">
        <a href="https://www.linkedin.com/in/adan-derolus-3b166a1bb/" target="_blank" rel="noopener noreferrer" aria-label="LinkedIn"><i class="fa fa-linkedin"></i></a>
        <a href="mailto:adanderolus@gmail.com" aria-label="Email"><i class="fa fa-envelope"></i></a>
      </div>
    </div>
  </footer>
</body>
</html>
